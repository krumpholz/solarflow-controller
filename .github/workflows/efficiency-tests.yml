name: Battery efficiency tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
        timezone: [UTC, Europe/Berlin]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate German wrappers and import flows
        run: python3 rolling-efficiency/build.py
      - name: Check generated files are current
        run: git diff --exit-code -- rolling-efficiency/battery-efficiency_DE.js rolling-efficiency/prepare-cycle_DE.js rolling-efficiency/prepare-sensor_DE.js rolling-efficiency/flow.json rolling-efficiency/flow_DE.json
      - name: Run calculation, mean and flow regressions
        run: node --test rolling-efficiency/tests/*.test.cjs

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish tested version with bilingual notes and import assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_version="$(cat VERSION)"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v${release_version}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; leaving it unchanged."
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = 'v' + Path('VERSION').read_text().strip()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          notes = '\n\n'.join(Path(p).read_text() for p in ['RELEASE_NOTES_DE.md', 'RELEASE_NOTES.md'])
          notes = re.sub(r'\]\((?!https?://|#)([^)]+)\)', lambda m: '](' + base + m[1] + ')', notes)
          Path('release-notes-combined.md').write_text(notes)
          PY
          gh release create "$release_tag" \
            rolling-efficiency/flow.json rolling-efficiency/flow_DE.json \
            rolling-efficiency/battery-efficiency.js rolling-efficiency/battery-efficiency_DE.js \
            rolling-efficiency/prepare-cycle.js rolling-efficiency/prepare-cycle_DE.js \
            rolling-efficiency/prepare-sensor.js rolling-efficiency/prepare-sensor_DE.js \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SolarFlow Controller $release_tag" --latest \
            --notes-file release-notes-combined.md
